# Keep the existing Compose project and database volume when this folder is renamed.
name: ai-backend

services:
  db:
    image: pgvector/pgvector:pg17 # Uses Postgres 17 with pgvector pre-installed
    container_name: pgvector_db
    restart: always
    environment:
      POSTGRES_USER: ${VECTORDB_USER:?VECTORDB_USER is required}
      POSTGRES_PASSWORD: ${VECTORDB_PASSWORD:?VECTORDB_PASSWORD is required}
      POSTGRES_DB: ${VECTORDB_NAME:?VECTORDB_NAME is required}
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      
volumes:
  pgvector_data:
